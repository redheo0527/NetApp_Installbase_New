<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetApp IB Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --netapp-blue: #0067b1;
            --netapp-dark: #002d5a;
            --neon-blue: #00d2ff;
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            letter-spacing: -0.03em;
            background: #f0f4f9;
        }
        /* 추상적 배경 패턴 */
        .bg-pattern {
            background-color: #f0f4f9;
            background-image: radial-gradient(at 0% 0%, rgba(0, 103, 177, 0.05) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.05) 0px, transparent 50%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.03);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .glass-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 15px 45px 0 rgba(0, 103, 177, 0.1);
            border-color: var(--neon-blue);
        }
        .neon-glow {
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }
        .sidebar-gradient {
            background: linear-gradient(180deg, #002d5a 0%, #001a35 100%) !important;
        }
        aside {
            background: linear-gradient(180deg, #002d5a 0%, #001a35 100%) !important;
        }
        .nav-active {
            background-color: rgba(0, 103, 177, 0.2) !important;
            color: #00d2ff !important;
            border: 1px solid rgba(0, 210, 255, 0.3) !important;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4) !important;
        }
        body {
            background: #f0f4f9 !important;
            background-image: radial-gradient(at 0% 0%, rgba(0, 103, 177, 0.05) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.05) 0px, transparent 50%) !important;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-pattern text-slate-800 flex min-h-screen">
    <aside class="w-80 hidden lg:flex flex-col text-white shadow-2xl shrink-0 sticky top-0 h-screen border-r border-white/5 sidebar-gradient">
        <div class="p-12">
            <div class="flex flex-col gap-2">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-lg neon-glow">
                        <i class="fa-solid fa-database text-[#0067b1] text-lg"></i>
                    </div>
                    <span class="text-3xl font-extrabold tracking-tighter">NetApp</span>
                </div>
                <span class="text-[10px] font-black text-blue-300/40 uppercase tracking-[0.4em] ml-1">INSTALLBASE SYSTEM</span>
            </div>
        </div>

        <nav class="flex-1 px-8 mt-4 space-y-3">
            <a href="{% url 'dashboard' %}" 
               class="flex items-center gap-4 px-6 py-4 rounded-2xl font-bold transition-all {% if request.resolver_match.url_name == 'dashboard' %}nav-active{% else %}text-slate-400 hover:text-white hover:bg-white/5{% endif %}">
                <i class="fa-solid fa-grid-2-wide w-5"></i>
                대시보드
            </a>

            <a href="{% url 'installbase_list' %}" 
               class="flex items-center gap-4 px-6 py-4 rounded-2xl font-bold transition-all group {% if request.resolver_match.url_name == 'installbase_list' %}nav-active{% else %}text-slate-400 hover:text-white hover:bg-white/5{% endif %}">
                <i class="fa-solid fa-server w-5 group-hover:text-blue-400"></i>
                ONTAP 시스템
            </a>

            <a href="{% url 'clusterswitch_list' %}" 
               class="flex items-center gap-4 px-6 py-4 rounded-2xl font-bold transition-all group {% if request.resolver_match.url_name == 'clusterswitch_list' or request.resolver_match.url_name == 'clusterswitch_create' or request.resolver_match.url_name == 'clusterswitch_update' or request.resolver_match.url_name == 'clusterswitch_deleted_list' %}nav-active{% else %}text-slate-400 hover:text-white hover:bg-white/5{% endif %}">
                <i class="fa-solid fa-network-wired w-5 group-hover:text-blue-400"></i>
                Switches
            </a>

            <a href="{% url 'issue_list' %}" 
               class="flex items-center gap-4 px-6 py-4 rounded-2xl font-bold transition-all group {% if request.resolver_match.url_name == 'issue_list' or request.resolver_match.url_name == 'issue_create' or request.resolver_match.url_name == 'issue_update' or request.resolver_match.url_name == 'issue_detail' or request.resolver_match.url_name == 'issue_deleted_list' %}nav-active{% else %}text-slate-400 hover:text-white hover:bg-white/5{% endif %}">
                <i class="fa-solid fa-exclamation-triangle w-5 group-hover:text-blue-400"></i>
                이슈 관리
            </a>

            <a href="{% url 'rma_list' %}" 
               class="flex items-center gap-4 px-6 py-4 rounded-2xl font-bold transition-all group {% if request.resolver_match.url_name == 'rma_list' or request.resolver_match.url_name == 'rma_create' or request.resolver_match.url_name == 'rma_update' or request.resolver_match.url_name == 'rma_deleted_list' %}nav-active{% else %}text-slate-400 hover:text-white hover:bg-white/5{% endif %}">
                <i class="fa-solid fa-box w-5 group-hover:text-blue-400"></i>
                RMA 관리
            </a>
            
            {% if user.is_staff or user.is_superuser %}
            <a href="{% url 'netapp_api_management' %}" 
               class="flex items-center gap-4 px-6 py-4 rounded-2xl font-bold transition-all group {% if request.resolver_match.url_name == 'netapp_api_management' %}nav-active{% else %}text-slate-400 hover:text-white hover:bg-white/5{% endif %}">
                <i class="fa-solid fa-gear w-5 group-hover:text-blue-400"></i>
                API 관리
            </a>
            {% endif %}
        </nav>

        <div class="p-8">
            <div class="relative group p-6 rounded-3xl overflow-hidden shadow-2xl" style="background: linear-gradient(to bottom right, #2563eb, #4f46e5) !important;">
                <div class="relative z-10">
                    <h4 class="text-sm font-black mb-1 text-white">{{ user.last_name }}{{ user.first_name }}</h4>
                    <p class="text-[10px] text-blue-100/70 mb-4 font-medium tracking-tight">NetApp Certified Engineer</p>
                    <a href="/admin/logout/" class="block w-full py-2 bg-white/20 hover:bg-white/30 backdrop-blur-md rounded-xl text-[10px] font-black uppercase tracking-widest transition-all text-center text-white">
                        Logout
                    </a>
                </div>
                <div class="absolute -right-4 -bottom-4 w-24 h-24 bg-white opacity-5 rounded-full blur-2xl group-hover:scale-150 transition-all duration-700"></div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0">
        <div class="flex-1 overflow-y-auto">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>

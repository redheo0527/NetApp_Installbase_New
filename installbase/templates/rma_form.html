{% extends 'base.html' %}

{% block content %}
<script>
	document.querySelectorAll('input[type="date"]').forEach(input => {
	    input.setAttribute('max', '9999-12-31');
	});
</script>

<div class="max-w-6xl mx-auto py-12 px-6">
    <div class="mb-10">
        <h2 class="text-3xl font-black text-gray-900 tracking-tight">RMA 등록</h2>
        <p class="text-gray-400 mt-2 font-medium">새로운 RMA를 등록합니다.</p>
    </div>

    <form method="post" id="rmaForm" class="space-y-8" onsubmit="return validateRMAForm(event)">
        {% csrf_token %}

        <div class="bg-white rounded-[2.5rem] p-10 shadow-sm border border-gray-50">
            <h3 class="text-lg font-bold text-gray-800 mb-8 border-b border-gray-50 pb-4">
                <i class="fa-solid fa-box text-indigo-500 mr-2"></i> RMA 기본 정보
            </h3>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-gray-600 mb-2">케이스 번호</label>
                    <div class="flex gap-3">
                        <input type="text" id="display_case_number" readonly 
                               placeholder="케이스 검색 버튼을 눌러주세요"
                               class="flex-1 p-4 rounded-2xl border-gray-100 bg-gray-50 text-sm focus:outline-none cursor-default">
                        
                        <input type="hidden" id="id_case_number" name="case_number">
                        <input type="hidden" id="selected_service_level">

                        <button type="button" onclick="openCaseModal()" class="px-4 py-3 bg-blue-500 text-white rounded-xl font-bold hover:bg-blue-600 transition text-sm whitespace-nowrap">
                            <i class="fa-solid fa-search mr-2"></i>검색
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-2">RMA 수량</label>
                    <input type="number" id="id_rma_quantity" name="rma_quantity" min="1" value="1"
                           class="w-full p-4 rounded-2xl border-gray-100 bg-gray-50 focus:ring-2 focus:ring-[#0067B3] text-sm"
                           onchange="updateRMASections()">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-2">반납 필요 여부 (공통)</label>
                    <select id="id_return_required" name="return_required" class="w-full p-4 rounded-2xl border-gray-100 bg-gray-50 text-sm">
                        <option value="required">반납 필요</option>
                        <option value="not_required">반납 불필요</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="rmaSections" class="space-y-6"></div>

        <div class="flex justify-end gap-3">
            <a href="{% url 'rma_list' %}" class="px-8 py-3 bg-gray-100 text-gray-600 rounded-xl font-bold hover:bg-gray-200 transition">취소</a>
            <button type="submit" onclick="enableFieldsBeforeSubmit()" class="px-8 py-3 bg-indigo-500 text-white rounded-xl font-bold hover:bg-indigo-600 transition shadow-lg">등록</button>
        </div>
    </form>
</div>

<div id="caseModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-2xl p-8 max-w-4xl w-full mx-4 shadow-2xl max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between mb-6">
            <h3 class="text-2xl font-bold text-gray-800">케이스 번호 선택</h3>
            <button onclick="closeCaseModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
        </div>
        <div class="mb-4">
            <input type="text" id="caseSearch" placeholder="케이스 번호, 이슈 제목 검색..."
                   class="w-full p-3 rounded-xl border border-gray-200" oninput="handleCaseSearch()">
        </div>
        <div id="caseList" class="space-y-3"></div>
        <div id="casePagination" class="mt-6 flex justify-center items-center gap-2">
            <!-- 페이지네이션 버튼 -->
        </div>
    </div>
</div>

<div id="partModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-2xl p-8 max-w-4xl w-full mx-4 shadow-2xl max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between mb-6">
            <h3 class="text-2xl font-bold text-gray-800">파트 선택</h3>
            <button onclick="closePartModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-2">파트 종류</label>
                <select id="partCategory" class="w-full p-3 rounded-xl border border-gray-200" onchange="updatePartType()">
                    <option value="">선택하세요</option>
                    <option value="Controller">Controller</option>
                    <option value="shelf">Shelf</option>
                    <option value="disk">Disk</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-2">파트 타입</label>
                <select id="partType" class="w-full p-3 rounded-xl border border-gray-200" onchange="loadParts()">
                    <option value="">선택하세요</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-2">파트 검색</label>
                <input type="text" id="partSearch" placeholder="파트 넘버 검색 (실시간 검색)..."
                       class="w-full p-3 rounded-xl border border-gray-200" oninput="loadParts()" autocomplete="off">
            </div>
        </div>
        <div class="mb-4">
            <button type="button" onclick="openNewPartModal()" class="px-4 py-2 bg-green-500 text-white rounded-xl font-bold hover:bg-green-600 transition text-sm">
                <i class="fa-solid fa-plus mr-2"></i>신규 파트 등록
            </button>
        </div>
        <div id="partList" class="space-y-3"></div>
    </div>
</div>

<div id="newPartModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-2xl p-8 max-w-md w-full mx-4 shadow-2xl">
        <div class="flex items-center justify-between mb-6">
            <h3 class="text-2xl font-bold text-gray-800">신규 파트 등록</h3>
            <button onclick="closeNewPartModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
        </div>
        <form id="newPartForm" class="space-y-4">
            <div><label class="block text-xs font-bold text-gray-600 mb-2">파트 종류</label><select id="newPartCategory" class="w-full p-3 rounded-xl border border-gray-200" onchange="updateNewPartType()" required><option value="">선택하세요</option><option value="Controller">Controller</option><option value="shelf">Shelf</option><option value="disk">Disk</option></select></div>
            <div><label class="block text-xs font-bold text-gray-600 mb-2">파트 타입</label><select id="newPartType" class="w-full p-3 rounded-xl border border-gray-200" required><option value="">선택하세요</option></select></div>
            <div><label class="block text-xs font-bold text-gray-600 mb-2">파트 넘버</label><input type="text" id="newPartNumber" class="w-full p-3 rounded-xl border border-gray-200" required></div>
            <div><label class="block text-xs font-bold text-gray-600 mb-2">파트 설명</label><textarea id="newPartDescription" rows="3" class="w-full p-3 rounded-xl border border-gray-200"></textarea></div>
            <div class="flex justify-end gap-3 mt-6">
                <button type="button" onclick="closeNewPartModal()" class="px-6 py-2.5 bg-gray-100 text-gray-600 rounded-xl font-bold text-sm">취소</button>
                <button type="submit" class="px-6 py-2.5 bg-green-500 text-white rounded-xl font-bold text-sm">등록</button>
            </div>
        </form>
    </div>
</div>

<script>
    const partTypeOptions = {
        Controller: ['chassis', 'controller', 'power', 'nvdimm', 'dimm', 'adapter', 'flash_cache', 'boot_device', 'nvdimm_module', 'nvram_battery', 'cable', 'sfp', 'FAN'],
        shelf: ['chassis', 'shelf_module', 'shelf_power', 'adapter'],
        disk: ['nvme', 'nl_sas', 'sas', 'ssd']
    };
    const partTypeLabels = {
        Controller: { 'chassis': 'Chassis', 'controller': '컨트롤러', 'power': 'Power', 'nvdimm': 'NVDIMM', 'dimm': 'DIMM', 'adapter': 'Adapter', 'flash_cache': 'Flash Cache', 'boot_device': 'Boot Device', 'nvdimm_module': 'NVDIMM 모듈', 'nvram_battery': 'NVRAM Battery', 'cable': 'Cable', 'sfp': 'SFP', 'FAN': 'FAN'},
        shelf: { 'chassis': 'Chassis', 'shelf_module': 'Shelf Module', 'shelf_power': 'Shelf Power', 'adapter': 'Adapter' },
        disk: { 'nvme': 'NVMe', 'nl_sas': 'NL-SAS', 'sas': 'SAS', 'ssd': 'SSD' }
    };

    let currentRMAIndex = 0;

    function updateRMASections() {
        const qty = parseInt(document.getElementById('id_rma_quantity').value) || 1;
        const container = document.getElementById('rmaSections');
        const currentData = [];
        container.querySelectorAll('.rma-card').forEach((sec, idx) => {
            currentData[idx] = {
                rma_num: sec.querySelector(`[name^="rma_number_"]`)?.value,
                part_id: sec.querySelector(`[id^="part_id_"]`)?.value,
                part_num: sec.querySelector(`[id^="part_number_"]`)?.value,
                cat: sec.querySelector(`[id^="part_category_"]`)?.value,
                p_qty: sec.querySelector(`[name^="part_quantity_"]`)?.value,
                d_reg: sec.querySelector(`[name^="delivery_region_"]`)?.value,
                d_date: sec.querySelector(`[name^="delivery_date_"]`)?.value,
                r_reg: sec.querySelector(`[name^="return_region_"]`)?.value,
                r_date: sec.querySelector(`[name^="return_date_"]`)?.value,
                status: sec.querySelector(`[id^="return_status_"]`)?.value,
                is_delay: sec.querySelector(`[name^="is_delayed_"]`)?.value
            };
        });

        container.innerHTML = '';
        for (let i = 0; i < qty; i++) {
            const div = document.createElement('div');
            div.className = 'rma-card bg-white rounded-[2.5rem] p-10 shadow-sm border border-gray-50';
            div.innerHTML = `
                <h3 class="text-lg font-bold text-gray-800 mb-6 border-b pb-4">RMA 상세 #${i+1}</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div><label class="block text-xs font-bold text-gray-600 mb-2">RMA 번호</label><input type="text" name="rma_number_${i}" class="w-full p-4 rounded-2xl border-gray-100 bg-gray-50 text-sm" required></div>
                    <div><label class="block text-xs font-bold text-gray-600 mb-2">파트 넘버</label>
                        <div class="flex gap-3">
                            <input type="text" id="part_number_${i}" readonly class="flex-1 p-4 rounded-2xl border-gray-100 bg-gray-50 text-sm" required>
                            <input type="hidden" id="part_id_${i}" name="part_id_${i}">
                            <input type="hidden" id="part_category_${i}" name="part_category_${i}">
                            <button type="button" onclick="openPartModal(${i})" class="px-4 py-3 bg-blue-500 text-white rounded-xl font-bold text-sm">검색</button>
                        </div>
                    </div>
                    <div><label class="block text-xs font-bold text-gray-600 mb-2">파트 수량</label><input type="number" name="part_quantity_${i}" min="1" value="1" class="w-full p-4 rounded-2xl border-gray-100 bg-gray-50 text-sm" required></div>
                    <div><label class="block text-xs font-bold text-gray-600 mb-2">배송 지역</label><input type="text" name="delivery_region_${i}" class="w-full p-4 rounded-2xl border-gray-100 bg-gray-50 text-sm" required></div>
                    <div><label class="block text-xs font-bold text-gray-600 mb-2">배송 일자</label><input type="date" name="delivery_date_${i}" max="9999-12-31" class="w-full p-4 rounded-2xl border-gray-100 bg-gray-50 text-sm"></div>
                    <div><label class="block text-xs font-bold text-gray-600 mb-2">반납 지역</label><input type="text" name="return_region_${i}" class="w-full p-4 rounded-2xl border-gray-100 bg-gray-50 text-sm"></div>
                    <div><label class="block text-xs font-bold text-gray-600 mb-2">반납 일자</label><input type="date" name="return_date_${i}" max="9999-12-31" class="w-full p-4 rounded-2xl border-gray-100 bg-gray-50 text-sm"></div>
                    <div><label class="block text-xs font-bold text-gray-600 mb-2">지연 배송 여부</label><select name="is_delayed_${i}" class="w-full p-4 rounded-2xl border-gray-100 bg-gray-50 text-sm"><option value="not_delivered">배송 미완료</option><option value="normal">정상배송</option><option value="delayed">지연배송</option></select></div>
                    <div><label class="block text-xs font-bold text-gray-600 mb-2">반납 여부</label>
                        <select id="return_status_${i}" name="return_status_${i}" class="w-full p-4 rounded-2xl border-gray-100 bg-gray-50 text-sm">
                            <option value="not_returned">미반납</option>
                            <option value="returned">반납</option>
                            <option value="not_required">반납 불필요</option>
                        </select>
                    </div>
                </div>`;
            container.appendChild(div);

            if (currentData[i]) {
                const d = currentData[i];
                document.getElementsByName(`rma_number_${i}`)[0].value = d.rma_num || '';
                document.getElementById(`part_id_${i}`).value = d.part_id || '';
                document.getElementById(`part_number_${i}`).value = d.part_num || '';
                document.getElementById(`part_category_${i}`).value = d.cat || '';
                document.getElementsByName(`part_quantity_${i}`)[0].value = d.p_qty || 1;
                document.getElementsByName(`delivery_region_${i}`)[0].value = d.d_reg || '';
                document.getElementsByName(`delivery_date_${i}`)[0].value = d.d_date || '';
                document.getElementsByName(`return_region_${i}`)[0].value = d.r_reg || '';
                document.getElementsByName(`return_date_${i}`)[0].value = d.r_date || '';
                document.getElementsByName(`is_delayed_${i}`)[0].value = d.is_delay || 'normal';
                document.getElementById(`return_status_${i}`).value = d.status || 'not_returned';
            }
            
            // 동적으로 생성된 날짜 입력 필드에 max 속성 설정
            const deliveryDateInput = document.querySelector(`input[name="delivery_date_${i}"]`);
            const returnDateInput = document.querySelector(`input[name="return_date_${i}"]`);
            if (deliveryDateInput) deliveryDateInput.setAttribute('max', '9999-12-31');
            if (returnDateInput) returnDateInput.setAttribute('max', '9999-12-31');
        }
        checkAllReturnStatus();
    }

    function selectCase(id, label, level) {
        document.getElementById('id_case_number').value = id;
        document.getElementById('display_case_number').value = label;
        document.getElementById('selected_service_level').value = level || 'Normal';
        closeCaseModal();
        checkAllReturnStatus();
    }

    function selectPart(id, num, cat) {
        document.getElementById(`part_id_${currentRMAIndex}`).value = id;
        document.getElementById(`part_number_${currentRMAIndex}`).value = num;
        document.getElementById(`part_category_${currentRMAIndex}`).value = cat;
        closePartModal();
        checkAllReturnStatus();
    }

    function checkAllReturnStatus() {
        const level = (document.getElementById('selected_service_level').value || '').toUpperCase();
        const qty = parseInt(document.getElementById('id_rma_quantity').value) || 0;
        const globalReturn = document.getElementById('id_return_required');

        let anyDiskNRD = false;

        for (let i = 0; i < qty; i++) {
            const cat = document.getElementById(`part_category_${i}`)?.value;
            const select = document.getElementById(`return_status_${i}`);

            if (cat === 'disk' && level.includes('NRD')) {
                anyDiskNRD = true;
                if (select) {
                    select.value = 'not_required';
                    select.disabled = true;
                    select.classList.add('bg-gray-200');
                }
            } else if (select) {
                select.disabled = false;
                select.classList.remove('bg-gray-200');
                // 디스크가 아니거나 NRD가 아니면 미반납으로 초기화
                if (select.value === 'not_required') {
                    select.value = 'not_returned';
                }
            }
        }

        if (anyDiskNRD && globalReturn) {
            globalReturn.value = 'not_required';
            globalReturn.disabled = true;
            globalReturn.classList.add('bg-gray-200');
        } else if (globalReturn) {
            globalReturn.disabled = false;
            globalReturn.classList.remove('bg-gray-200');
            // 디스크 NRD가 아니면 반납 필요로 초기화
            if (globalReturn.value === 'not_required') {
                globalReturn.value = 'required';
            }
        }
    }

    let currentCasePage = 1;
    let caseSearchTimeout = null;
    
    function openCaseModal() { 
        document.getElementById('caseModal').classList.remove('hidden'); 
        document.getElementById('caseSearch').value = '';
        currentCasePage = 1;
        loadCases(); 
    }
    function closeCaseModal() { 
        document.getElementById('caseModal').classList.add('hidden'); 
        document.getElementById('caseSearch').value = '';
        currentCasePage = 1;
    }
    
    function handleCaseSearch() {
        // 디바운싱: 입력이 멈춘 후 300ms 후에 검색 실행
        clearTimeout(caseSearchTimeout);
        caseSearchTimeout = setTimeout(() => {
            currentCasePage = 1;
            loadCases();
        }, 300);
    }
    
    function loadCases(page = null) {
        if (page !== null) {
            currentCasePage = page;
        }
        const q = document.getElementById('caseSearch').value.trim();
        fetch(`/ajax/get-cases/?q=${encodeURIComponent(q)}&page=${currentCasePage}`)
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('caseList');
                if (data.cases && data.cases.length > 0) {
                    list.innerHTML = data.cases.map(c => {
                        const statusTxt = c.status_display || '상태없음';
                        const caseNumber = c.case_number && !c.case_number.startsWith('ISSUE-') ? c.case_number : '';
                        const label = caseNumber ? `${c.title} - ${caseNumber} - ${statusTxt}` : `${c.title} - ${statusTxt}`;
                        return `<div class="p-4 bg-gray-50 rounded-xl cursor-pointer hover:bg-blue-50"
                                     onclick="selectCase(${c.id}, '${label.replace(/'/g, "\\'")}', '${c.service_level || 'Normal'}')">
                            <div class="font-bold text-blue-600">${c.title}</div>
                            ${caseNumber ? `<div class="text-xs text-gray-500 mt-1">케이스 번호: ${caseNumber}</div>` : ''}
                            <div class="flex justify-between text-xs text-gray-500 mt-2">
                                <span>상태: ${statusTxt}</span>
                                <span class="font-bold text-indigo-500">S/L: ${c.service_level || 'Normal'}</span>
                            </div>
                        </div>`;
                    }).join('');
                } else {
                    list.innerHTML = '<div class="text-center py-8 text-gray-400">검색 결과가 없습니다.</div>';
                }
                
                // 페이지네이션 UI 업데이트
                updateCasePagination(data);
            });
    }
    
    function updateCasePagination(data) {
        const pagination = document.getElementById('casePagination');
        let html = '';
        
        if (data.total_count > 0) {
            const totalPages = Math.ceil(data.total_count / data.per_page);
            
            // 이전 버튼
            if (data.has_prev) {
                html += `<button onclick="loadCases(${data.page - 1})" class="px-3 py-1.5 bg-gray-100 text-gray-600 rounded-lg text-sm font-bold hover:bg-gray-200 transition">이전</button>`;
            }
            
            // 페이지 번호 표시
            html += `<span class="px-3 py-1.5 text-sm text-gray-600">페이지 ${data.page} / ${totalPages} (총 ${data.total_count}개)</span>`;
            
            // 다음 버튼
            if (data.has_next) {
                html += `<button onclick="loadCases(${data.page + 1})" class="px-3 py-1.5 bg-gray-100 text-gray-600 rounded-lg text-sm font-bold hover:bg-gray-200 transition">다음</button>`;
            }
        }
        
        pagination.innerHTML = html;
    }

    function openPartModal(idx) {
        currentRMAIndex = idx;
        
        // 현재 선택된 파트 정보 가져오기
        const partId = document.getElementById(`part_id_${idx}`)?.value;
        const partNumber = document.getElementById(`part_number_${idx}`)?.value;
        const partCategory = document.getElementById(`part_category_${idx}`)?.value;
        
        // 모달 필드 초기화 또는 현재 값 설정
        if (partId && partNumber && partCategory) {
            // 이미 선택된 파트가 있으면 해당 정보 표시
            document.getElementById('partCategory').value = partCategory;
            updatePartType();
            
            // 파트 타입은 AJAX로 가져와야 함
            fetch(`/ajax/get-parts-by-category/?part_id=${partId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.part) {
                        setTimeout(() => {
                            document.getElementById('partType').value = data.part.part_type || '';
                            document.getElementById('partSearch').value = partNumber;
                            loadParts();
                        }, 100);
                    } else {
                        document.getElementById('partSearch').value = partNumber;
                        loadParts();
                    }
                })
                .catch(() => {
                    document.getElementById('partSearch').value = partNumber;
                    loadParts();
                });
        } else {
            // 선택된 파트가 없으면 초기화
            document.getElementById('partCategory').value = '';
            document.getElementById('partType').innerHTML = '<option value="">선택하세요</option>';
            document.getElementById('partSearch').value = '';
            document.getElementById('partList').innerHTML = '<div class="p-4 text-center text-gray-400">파트 종류를 선택하거나 파트 번호를 입력해주세요.</div>';
        }
        
        document.getElementById('partModal').classList.remove('hidden');
    }
    
    function closePartModal() {
        document.getElementById('partModal').classList.add('hidden');
    }
    function updatePartType() {
        const cat = document.getElementById('partCategory').value;
        const ts = document.getElementById('partType');
        ts.innerHTML = '<option value="">선택</option>' + (partTypeOptions[cat]?.map(t => `<option value="${t}">${partTypeLabels[cat][t]}</option>`).join('') || '');
        // 파트 타입 업데이트 후 검색 다시 실행
        const search = document.getElementById('partSearch').value.trim();
        if (search || cat) {
            loadParts();
        }
    }
    function loadParts() {
        const cat = document.getElementById('partCategory').value;
        const type = document.getElementById('partType').value;
        const search = document.getElementById('partSearch').value.trim();
        
        // 파트 종류가 선택되지 않고 검색어도 없는 경우
        if (!cat && !search) {
            document.getElementById('partList').innerHTML = '';
            return;
        }
        
        // 파트 종류가 선택되지 않았지만 검색어가 있는 경우 - 전체 검색
        let url;
        if (!cat && search) {
            url = `/ajax/get-parts-by-category/?q=${encodeURIComponent(search)}`;
        } else {
            // 선택된 파트 종류와 타입에 해당하는 파트만 검색
            url = `/ajax/get-parts-by-category/?category=${cat}&part_type=${type}&q=${encodeURIComponent(search)}`;
        }
        
        fetch(url)
            .then(res => res.json())
            .then(data => {
                if (data.parts && data.parts.length > 0) {
                    document.getElementById('partList').innerHTML = data.parts.map(p => `
                        <div class="p-4 bg-gray-50 rounded-xl cursor-pointer hover:bg-blue-50" onclick="selectPart(${p.id}, '${p.part_number}', '${p.category}')">
                            <div class="font-mono font-bold">${p.part_number}</div>
                            <div class="text-xs text-gray-400">${p.part_type}${p.category ? ' (' + p.category + ')' : ''}</div>
                            ${p.description ? `<div class="text-xs text-gray-500 mt-1">${p.description}</div>` : ''}
                        </div>`).join('');
                } else {
                    document.getElementById('partList').innerHTML = '<div class="p-4 text-center text-gray-400">검색 결과가 없습니다.</div>';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('partList').innerHTML = '<div class="p-4 text-center text-red-400">검색 중 오류가 발생했습니다.</div>';
            });
    }

    function openNewPartModal() { document.getElementById('newPartModal').classList.remove('hidden'); }
    function closeNewPartModal() { document.getElementById('newPartModal').classList.add('hidden'); document.getElementById('newPartForm').reset(); }
    function updateNewPartType() {
        const cat = document.getElementById('newPartCategory').value;
        const ts = document.getElementById('newPartType');
        ts.innerHTML = '<option value="">선택</option>' + (partTypeOptions[cat]?.map(t => `<option value="${t}">${partTypeLabels[cat][t]}</option>`).join('') || '');
    }

    // 신규 파트 등록 폼 이벤트 리스너 등록
    function initNewPartForm() {
        const newPartForm = document.getElementById('newPartForm');
        if (!newPartForm) {
            console.error('newPartForm not found');
            return;
        }
        
        // 기존 이벤트 리스너 제거 후 재등록
        const newForm = newPartForm.cloneNode(true);
        newPartForm.parentNode.replaceChild(newForm, newPartForm);
        
        newForm.addEventListener('submit', function(e) {
        e.preventDefault();
        e.stopPropagation();
        
        const partNumber = document.getElementById('newPartNumber').value.trim();
        const category = document.getElementById('newPartCategory').value;
        const partType = document.getElementById('newPartType').value;
        const description = document.getElementById('newPartDescription').value.trim();
        
        if (!partNumber || !category || !partType) {
            alert('파트 종류, 파트 타입, 파트 넘버를 모두 입력해주세요.');
            return false;
        }
        
        const fd = new FormData();
        fd.append('part_number', partNumber);
        fd.append('category', category);
        fd.append('part_type', partType);
        fd.append('description', description);
        
        // CSRF 토큰 가져오기
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || 
                         document.querySelector('input[name="csrfmiddlewaretoken"]')?.value ||
                         document.querySelector('meta[name="csrf-token"]')?.getAttribute('content');
        
        if (!csrfToken) {
            alert('CSRF 토큰을 찾을 수 없습니다. 페이지를 새로고침해주세요.');
            return false;
        }
        
        fetch('/part/add/ajax/', {
            method: 'POST',
            body: fd,
            headers: {
                'X-CSRFToken': csrfToken
            }
        })
        .then(res => {
            if (!res.ok) {
                return res.json().then(err => Promise.reject(err));
            }
            return res.json();
        })
        .then(data => {
            if (data.error) {
                alert('오류: ' + data.error);
                return;
            }
            if (data.id) {
                selectPart(data.id, data.name, category);
                closeNewPartModal();
            } else {
                alert('파트 등록에 실패했습니다.');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('파트 등록 중 오류가 발생했습니다: ' + (error.error || error.message || '알 수 없는 오류'));
        });
        
        return false;
        });
    }

    // 페이지 로드 시 초기화
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            updateRMASections();
            initNewPartForm();
            const urlParams = new URLSearchParams(window.location.search);
            const caseId = urlParams.get('case_number') || {% if case_number_id %}{{ case_number_id }}{% else %}null{% endif %};
            if (caseId) {
                fetch(`/ajax/get-cases/?case_number=${caseId}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.cases && data.cases.length > 0) {
                            const c = data.cases[0];
                            const statusTxt = c.status_display || '상태미정';
                            const caseNumber = c.case_number && !c.case_number.startsWith('ISSUE-') ? c.case_number : '';
                            const label = caseNumber ? `${c.title} - ${caseNumber} - ${statusTxt}` : `${c.title} - ${statusTxt}`;
                            selectCase(c.id, label, c.service_level);
                        }
                    });
            }
        });
    } else {
        updateRMASections();
        initNewPartForm();
        const urlParams = new URLSearchParams(window.location.search);
        const caseId = urlParams.get('case_number') || {% if case_number_id %}{{ case_number_id }}{% else %}null{% endif %};
        if (caseId) {
            fetch(`/ajax/get-cases/?case_number=${caseId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.cases && data.cases.length > 0) {
                        const c = data.cases[0];
                        const statusTxt = c.status_display || '상태미정';
                        const caseNumber = c.case_number && !c.case_number.startsWith('ISSUE-') ? c.case_number : '';
                        const label = caseNumber ? `${c.title} - ${caseNumber} - ${statusTxt}` : `${c.title} - ${statusTxt}`;
                        selectCase(c.id, label, c.service_level);
                    }
                });
        }
    }

    function enableFieldsBeforeSubmit() {
        document.querySelectorAll('select:disabled, input:disabled').forEach(el => el.disabled = false);
    }

    // 필수 필드 검증
    function validateRMAForm(event) {
        const rmaQuantity = parseInt(document.getElementById('id_rma_quantity').value) || 1;
        const missingFields = [];
        
        // 각 RMA 항목별 필수 필드 확인
        for (let i = 0; i < rmaQuantity; i++) {
            // RMA 번호 확인
            const rmaNumber = document.querySelector(`input[name="rma_number_${i}"]`);
            if (!rmaNumber || !rmaNumber.value || rmaNumber.value.trim() === '') {
                if (!missingFields.includes('RMA 번호')) {
                    missingFields.push('RMA 번호');
                }
            }
            
            // 파트 넘버 확인
            const partId = document.getElementById(`part_id_${i}`);
            if (!partId || !partId.value || partId.value.trim() === '') {
                if (!missingFields.includes('파트 넘버')) {
                    missingFields.push('파트 넘버');
                }
            }
            
            // 배송 지역 확인
            const deliveryRegion = document.querySelector(`input[name="delivery_region_${i}"]`);
            if (!deliveryRegion || !deliveryRegion.value || deliveryRegion.value.trim() === '') {
                if (!missingFields.includes('배송 지역')) {
                    missingFields.push('배송 지역');
                }
            }
        }
        
        if (missingFields.length > 0) {
            event.preventDefault();
            alert('다음 필수 항목을 입력해주세요:\n\n' + missingFields.join('\n'));
            return false;
        }
        
        return true;
    }
</script>
{% endblock %}
